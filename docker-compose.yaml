name: securoapi

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports: ["1433:1433"]
    volumes: ["mssql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: { context: ./backend, dockerfile: SecuroAPI-API/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SecuroAPIDbContext: "Server=sqlserver,1433;Database=SecuroAPIDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__Host: rabbitmq
      JwtSettings__Key: "${JWT_KEY}"
      JwtSettings__Issuer: "${JWT_ISSUER}"
      JwtSettings__Audience: "${JWT_AUDIENCE}"
      JwtSettings__DurationInMinutes: "${JWT_DURATIONINMINUTES}"
      RabbitMq__Username: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASS}"
    ports: ["8080:8080"]
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq:  { condition: service_healthy }

  monitoring:
    build: { context: ./backend, dockerfile: SecuroAPI-MonitoringService/Dockerfile }
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASS}"
    depends_on:
      rabbitmq:  { condition: service_healthy }
      
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      POST: 1
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    restart: unless-stopped 
     
  testrunner:
    build: { context: ./backend, dockerfile: SecuroAPI-TestRunnerService/Dockerfile }
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASS}"
    depends_on:
      rabbitmq:  { condition: service_healthy }
      socket-proxy: { condition: service_started }
        
  frontend:
    build: { context: ./frontend }
    ports: ["4200:80"]
    depends_on: ["api"]

volumes:
  mssql-data:
  rabbitmq-data: