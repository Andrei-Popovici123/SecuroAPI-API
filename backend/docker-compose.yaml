name: securoapi

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports: ["1433:1433"]
    volumes: ["mssql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: { context: ./backend, dockerfile: SecuroAPI-API/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SecuroAPI;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASS}"
    ports: ["8080:8080"]
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq:  { condition: service_healthy }

  monitoring:
    build: { context: ./backend, dockerfile: SecuroAPI.Monitoring/Dockerfile }
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASS}"
    depends_on:
      rabbitmq:  { condition: service_healthy }

  testrunner:
    build: { context: ./backend, dockerfile: SecuroAPI.TestRunner/Dockerfile }
    environment:
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: "${RABBITMQ_USER}"
      RabbitMq__Password: "${RABBITMQ_PASS}"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    depends_on:
      rabbitmq:  { condition: service_healthy }

  frontend:
    build: { context: ./frontend }
    ports: ["4200:80"]
    depends_on: ["api"]

volumes:
  mssql-data:
  rabbitmq-data: