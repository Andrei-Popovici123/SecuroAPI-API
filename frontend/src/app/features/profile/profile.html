<div class="grid min-h-full place-items-center">
  <div class="w-full max-w-lg">
    <h1 class="mb-5 text-xl font-semibold">Profile</h1>
  @if (loading()) {
    <div class="grid place-items-center py-16"><app-spinner [size]="28" /></div>
  } @else {
    <div class="card p-6">
      <!-- header -->
      <div class="mb-6 flex items-center gap-4">
        <span class="grid h-14 w-14 place-items-center rounded-full bg-surface-2 text-lg font-semibold">{{ initials() }}</span>
        <div class="min-w-0">
          <div class="truncate font-mono text-sm text-text-dim">{{ store.email() }}</div>
          <div class="mt-1"><app-status-pill [label]="meta().label" [tone]="meta().tone" /></div>
        </div>
      </div>

      <!-- editable fields -->
      <div class="flex flex-col gap-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label" for="fn">First name</label>
            <input id="fn" class="field" [value]="firstName()" (input)="firstName.set(val($event))" />
          </div>
          <div>
            <label class="label" for="ln">Last name</label>
            <input id="ln" class="field" [value]="lastName()" (input)="lastName.set(val($event))" />
          </div>
        </div>
        <div>
          <label class="label" for="co">Company</label>
          <input id="co" class="field" [value]="companyName()" (input)="companyName.set(val($event))" />
        </div>
        <div>
          <label class="label" for="em">Email</label>
          <input id="em" class="field opacity-60" [value]="store.email()" disabled />
          <p class="mt-1 text-xs text-text-dim">Email is your login identity and can't be changed here.</p>
        </div>
      </div>

      <!-- messages -->
      @if (error()) { <p class="mt-3 text-sm text-danger">{{ error() }}</p> }
      @if (savedOk()) { <p class="mt-3 text-sm" style="color: var(--color-ok)">Profile saved.</p> }

      <!-- actions -->
      <div class="mt-6 flex items-center justify-between border-t border-border pt-4">
        <button class="btn-ghost !border-danger/40 !text-danger" (click)="logout()">Sign out</button>
        <div class="flex gap-2">
          @if (dirty()) { <button class="btn-ghost" (click)="reset()">Cancel</button> }
          <button class="btn-primary" (click)="save()" [disabled]="saving() || !valid() || !dirty()">
            @if (saving()) { <app-spinner [size]="16" /> }
            {{ saving() ? 'Saving…' : 'Save changes' }}
          </button>
        </div>
      </div>
    </div>
  }
  </div>
</div>
