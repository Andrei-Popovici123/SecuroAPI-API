<div class="mx-auto max-w-5xl">
  <h1 class="mb-1 text-xl font-semibold">Monitoring</h1>
  <p class="mb-5 text-sm text-text-dim">All monitored endpoints across your targets.</p>

  @if (loading()) {
    <div class="grid place-items-center py-16"><app-spinner [size]="28" /></div>
  } @else if (error()) {
    <div class="card p-6 text-sm text-danger">{{ error() }}</div>
  } @else if (!rows().length) {
    <p class="py-10 text-center text-sm text-text-dim">No monitored endpoints yet.</p>
  } @else {
    <div class="flex flex-col gap-2">
      @for (r of rows(); track r.ep.endpointId) {
        <button type="button" (click)="open(r)"
                class="row card flex w-full items-center gap-4 p-4 text-left transition-colors hover:border-info/60">
          <!-- label + host -->
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2">
              <span class="h-2 w-2 shrink-0 rounded-full" [style.background]="dot(r.ep)"></span>
              <span class="truncate text-sm font-medium">{{ r.ep.label }}</span>
              @if (!r.ep.isActive) { <span class="text-xs text-text-dim">(paused)</span> }
            </div>
            <div class="mt-0.5 truncate font-mono text-xs text-text-dim" [title]="r.ep.url">{{ r.ep.url }}</div>
            <div class="text-[11px] text-text-dim">{{ r.host }}</div>
          </div>

          <!-- sparkline -->
          <div class="hidden shrink-0 md:block">
            <app-sparkline [values]="r.latency" [width]="160" [height]="36" />
          </div>

          <!-- metrics on one line -->
          <div class="hidden shrink-0 gap-5 text-sm sm:flex">
            <div class="stat"><span class="lbl">Latency</span><span class="val">{{ r.ep.lastLatencyMs ?? '—' }}ms</span></div>
            <div class="stat"><span class="lbl">Status</span><span class="val">{{ r.ep.lastStatusCode ?? '—' }}</span></div>
            <div class="stat"><span class="lbl">HSTS</span><span class="val" [style.color]="r.ep.hasHsts ? 'var(--color-ok)' : 'var(--color-text-dim)'">{{ r.ep.hasHsts ? '✓' : '—' }}</span></div>
            <div class="stat"><span class="lbl">CSP</span><span class="val" [style.color]="r.ep.hasCsp ? 'var(--color-ok)' : 'var(--color-text-dim)'">{{ r.ep.hasCsp ? '✓' : '—' }}</span></div>
          </div>

          <svg class="arrow shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      }
    </div>
  }
</div>
