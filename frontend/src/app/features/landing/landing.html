<div class="mx-auto flex min-h-full max-w-3xl flex-col justify-center py-8">
  <!-- greeting -->
  <div class="mb-8 flex items-center gap-3">
    <img src="favicon.ico" alt="" width="40" height="40" aria-hidden="true" />
    <div>
      <h1 class="text-2xl font-semibold">Welcome back, {{ firstName() }}.</h1>
      <p class="text-sm text-text-dim">Where would you like to go?</p>
    </div>
  </div>

  <!-- link cards -->
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
    @for (l of visible(); track l.path) {
      <a [routerLink]="l.path" class="home-card card group p-5">
        <div class="flex items-center justify-between">
          <span class="text-base font-semibold">{{ l.label }}</span>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="mt-1 text-sm text-text-dim">{{ l.desc }}</p>
      </a>
    }
  </div>
</div>
