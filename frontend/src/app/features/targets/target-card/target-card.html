<a
  [routerLink]="['/targets', registry().apiid]"
  class="card group flex flex-col gap-4 p-5 transition-colors hover:border-info/60"
>
  <!-- header: target + status -->
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <div class="truncate font-mono text-sm text-text" [title]="registry().targetURL">
        {{ displayUrl() }}
      </div>
      <div class="mt-1 text-xs text-text-dim">
        {{ scanned() ? (latest()!.numberOfTests + ' checks · ' + latest()!.coveragePercent + '% coverage') : 'Never scanned' }}
      </div>
    </div>
    <app-status-pill [label]="statusMeta().label" [tone]="statusMeta().tone" />
  </div>

  <!-- body: dial + trend -->
  @if (scanned()) {
    <div class="flex items-center justify-between gap-4">
      <app-score-dial [score]="latest()!.overallScore" [size]="104" label="Score" />
      <div class="flex flex-1 flex-col items-end gap-1">
        <app-sparkline [values]="trend()" [width]="140" [height]="40" />
        <span class="text-[11px] text-text-dim">score trend</span>
      </div>
    </div>
  } @else {
    <div class="flex h-[104px] items-center justify-center rounded-md border border-dashed border-border text-sm text-text-dim">
      Run a scan to see a score
    </div>
  }
</a>
