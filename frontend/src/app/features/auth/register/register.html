<div class="grid min-h-screen place-items-center bg-bg p-4">
  <div class="card w-full max-w-md p-6">
    <div class="mb-6 flex items-center gap-2">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2 4 5v6c0 5 3.5 8 8 11 4.5-3 8-6 8-11V5l-8-3Z" fill="var(--color-surface-2)" stroke="var(--color-danger)" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="m8.5 12 2.5 2.5 4.5-5" stroke="var(--color-danger)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="font-semibold tracking-tight">Securo<span class="text-text-dim">API</span></span>
    </div>

    @if (done()) {
      <h1 class="mb-1 text-lg font-semibold">Account created</h1>
      <p class="mb-5 text-sm text-text-dim">
        An administrator must approve your account before you can sign in. You'll be
        able to log in once that's done.
      </p>
      <a routerLink="/login" class="btn-primary w-full">Back to sign in</a>
    } @else {
      <h1 class="mb-1 text-lg font-semibold">Create account</h1>
      <p class="mb-5 text-sm text-text-dim">Then an admin approves access.</p>

      <div class="flex flex-col gap-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label" for="firstName">First name</label>
            <input id="firstName" class="field" [value]="firstName()" (input)="firstName.set(val($event))" />
          </div>
          <div>
            <label class="label" for="lastName">Last name</label>
            <input id="lastName" class="field" [value]="lastName()" (input)="lastName.set(val($event))" />
          </div>
        </div>
        <div>
          <label class="label" for="company">Company <span class="text-text-dim">(optional)</span></label>
          <input id="company" class="field" [value]="companyName()" (input)="companyName.set(val($event))" />
        </div>
        <div>
          <label class="label" for="remail">Email</label>
          <input id="remail" class="field" type="email" autocomplete="email"
                 [value]="email()" (input)="email.set(val($event))" />
        </div>
        <div>
          <label class="label" for="rpassword">Password <span class="text-text-dim">(min 12 chars)</span></label>
          <input id="rpassword" class="field" type="password" autocomplete="new-password"
                 [value]="password()" (input)="password.set(val($event))" />
        </div>

        @if (error()) {
          <p class="text-sm text-danger">{{ error() }}</p>
        }

        <button class="btn-primary mt-1" (click)="submit()" [disabled]="loading() || !valid()">
          @if (loading()) { <app-spinner [size]="16" /> }
          {{ loading() ? 'Creating…' : 'Create account' }}
        </button>
      </div>

      <p class="mt-5 text-center text-sm text-text-dim">
        Already have an account?
        <a routerLink="/login" class="text-info hover:underline">Sign in</a>
      </p>
    }
  </div>
</div>
