<aside class="hidden h-full w-56 shrink-0 flex-col overflow-y-auto border-r border-border bg-surface p-3 md:flex">
  <!-- primary nav -->
  <nav class="flex flex-col gap-1">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/>
      </svg>
      Dashboard
    </a>

    <a routerLink="/apis" routerLinkActive="active" class="nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 3 3 8l9 5 9-5-9-5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="m3 12 9 5 9-5M3 16l9 5 9-5" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
      My APIs
    </a>

    <a routerLink="/scans" routerLinkActive="active" class="nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/>
        <path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      Scans
    </a>

    <a routerLink="/monitoring" routerLinkActive="active" class="nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M3 12h4l2-6 4 12 2-6h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Monitoring
    </a>
  </nav>

  <!-- pinned to bottom -->
  <div class="mt-auto flex flex-col gap-1 border-t border-border pt-3">
    @if (store.isAdmin()) {
      <a routerLink="/admin" routerLinkActive="active" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 3 5 6v5c0 4 3 6.5 7 8 4-1.5 7-4 7-8V6l-7-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        </svg>
        Admin
      </a>
    }
    <button (click)="logout()" class="nav-link signout">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="m16 17 5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Sign out
    </button>
  </div>
</aside>
