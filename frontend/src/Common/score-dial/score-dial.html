<div
  class="relative inline-grid place-items-center"
  [style.width.px]="size()"
  [style.height.px]="size()"
>
  <svg class="dial -rotate-90" viewBox="0 0 120 120" [attr.width]="size()" [attr.height]="size()">
    <!-- track -->
    <circle cx="60" cy="60" r="52" fill="none" stroke="var(--color-border)" stroke-width="10" />
    <!-- progress -->
    <circle
      cx="60"
      cy="60"
      r="52"
      fill="none"
      [attr.stroke]="color()"
      stroke-width="10"
      stroke-linecap="round"
      [attr.stroke-dasharray]="circumference"
      [attr.stroke-dashoffset]="dashoffset()"
    />
  </svg>

  <!-- center readout -->
  <div class="absolute flex flex-col items-center">
    <span class="font-mono font-semibold leading-none" [style.color]="color()" [style.fontSize.px]="size() * 0.26">
      {{ score() }}
    </span>
    <span class="mt-1 text-[10px] uppercase tracking-wide text-text-dim">{{ label() }}</span>
  </div>
</div>
