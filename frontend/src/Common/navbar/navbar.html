<header class="flex h-14 items-center justify-between border-b border-border bg-surface px-4">
  <!-- brand -->
  <a routerLink="/dashboard" class="flex items-center gap-2">
    <img
      src="favicon.ico"
      alt=""
      width=48
      height="100"
      aria-hidden="true"
    />

    <span class="font-semibold tracking-tight">
    Securo<span class="text-text-dim">API</span>
  </span>
  </a>

  <!-- user block -->
  @if (store.isAuthenticated()) {
    <div class="flex items-center gap-3">
      <div class="hidden text-right sm:block">
        <div class="text-sm leading-tight">{{ store.name() }}</div>
        <div class="font-mono text-[11px] leading-tight text-text-dim">{{ store.email() }}</div>
      </div>
      <app-status-pill [label]="statusMeta().label" [tone]="statusMeta().tone" />
      <button
        (click)="logout()"
        class="rounded-md border border-border px-3 py-1.5 text-sm text-text-dim transition-colors hover:border-danger hover:text-danger"
      >
        Sign out
      </button>
    </div>
  }
</header>
