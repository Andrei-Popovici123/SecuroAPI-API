<header class="flex h-14 items-center justify-between border-b border-border bg-surface px-4">
  <!-- brand -->
  <a routerLink="/dashboard" class="flex items-center gap-2">
    <img
      src="favicon.ico"
      alt=""
      width=48
      height="100"
      aria-hidden="true"
    />

    <span class="font-semibold tracking-tight">
    Securo<span class="text-text-dim">API</span>
  </span>
  </a>

  <!-- user block -->
  @if (store.isAuthenticated()) {

    <a routerLink="/profile" routerLinkActive="border-info"
       class="flex items-center gap-3 rounded-md border border-border py-1 pl-1 pr-2 transition-colors hover:border-info">
    <span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-surface-2 text-xs font-semibold">
      {{ initials() }}
    </span>
      <span class="hidden text-right sm:block">
      <span class="block text-sm leading-tight">{{ store.name() }}</span>
      <span class="block font-mono text-[11px] leading-tight text-text-dim">{{ store.email() }}</span>
    </span>
      <app-status-pill [label]="statusMeta().label" [tone]="statusMeta().tone" />
    </a>
  }
</header>
